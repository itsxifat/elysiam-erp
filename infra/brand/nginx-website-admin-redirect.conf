# The brand website's `/admin`, sent to the brand's ERP (M31, D-475).
#
# Not installed by anything here: paste these two locations into the `server` block that
# serves the brand's website (`<brand domain>` and `www.<brand domain>`), replacing
# __ADMIN_HOST__ with the brand's admin host, then `sudo nginx -t && sudo systemctl reload nginx`.
# The website's own `/admin` panel is retired by M36; until then, add this only once the
# brand's staff work in the ERP.
#
# The ERP's console lives at `https://admin.<brand domain>/` and nothing of the ERP is served
# from the website's host: cookies, the console and the API stay on the admin host.

location = /admin {
    return 301 https://__ADMIN_HOST__/;
}

location ^~ /admin/ {
    return 301 https://__ADMIN_HOST__/;
}
