# One brand's ERP on the brands server (M31, D-474): its own Postgres 17, Valkey, Gotenberg,
# API, worker, camera process (M38c) and files volume, as one Compose project named
# `erp-<slug>`. Every brand runs
# the same image from the same commit; nothing in one brand's project reaches another's.
#
#   docker compose -f infra/brand/docker-compose.brand.yml --env-file <brands>/<slug>/.env.brand ...
#
# infra/brand/server-deploy.sh runs it; docs/runbooks/brand-deploy.md walks through it.
# Nothing here listens on a public address: the API is published on 127.0.0.1 only, for the
# host's nginx (infra/brand/nginx-brand.conf), and Postgres, Valkey and Gotenberg publish
# nothing. Every secret comes from the brand's own .env.brand (written by new-brand.sh,
# readable by its owner only, never committed).

name: erp-${BRAND_SLUG:?set BRAND_SLUG in the brand's .env.brand}

x-server-env: &server-env
  NODE_ENV: production
  LOG_LEVEL: info
  # The one brand this deployment serves: the API and the worker refuse to start beside any
  # other real brand (D-470), and it is the audience an owner sign-in link must name (D-473).
  ERP_BRAND_SLUG: ${BRAND_SLUG}
  DATABASE_URL: postgres://erp_app:${BRAND_DB_APP_PASSWORD:?run infra/brand/new-brand.sh}@postgres:5432/erp
  VALKEY_URL: redis://:${BRAND_VALKEY_PASSWORD:?}@valkey:6379
  # The brand's admin host serves the console, portal, till and API on one origin. Cookies
  # are scoped to it alone, so the brand's website on the parent domain never receives them.
  APP_DOMAIN: ${BRAND_ADMIN_HOST:?}
  API_PUBLIC_URL: https://${BRAND_ADMIN_HOST}
  TRUSTED_ORIGINS: https://${BRAND_ADMIN_HOST}
  # The host's nginx is the one proxy in front, and sets X-Forwarded-For itself.
  TRUSTED_PROXY_COUNT: 1
  REALTIME_ADAPTER_KEY: erp:${BRAND_SLUG}
  AUTH_SECRET: ${BRAND_AUTH_SECRET:?}
  HR_FIELD_KEY: ${BRAND_HR_FIELD_KEY:?}
  COURIER_CREDENTIALS_KEY: ${BRAND_COURIER_CREDENTIALS_KEY:?}
  MARKETING_CREDENTIALS_KEY: ${BRAND_MARKETING_CREDENTIALS_KEY:?}
  # M34 (D-528): seals the brand's SSLCommerz and email server passwords. Empty keeps
  # Website → Payments and Email off until it is set (new-brand.sh writes one).
  STOREFRONT_CREDENTIALS_KEY: ${BRAND_STOREFRONT_CREDENTIALS_KEY:-}
  STOREFRONT_CREDENTIALS_KEY_ID: ${BRAND_STOREFRONT_CREDENTIALS_KEY_ID:-k1}
  # A live brand never takes SSLCommerz sandbox payments (D-525): its test cards are public.
  STOREFRONT_SSLCOMMERZ_ALLOW_SANDBOX: ${BRAND_SSLCOMMERZ_ALLOW_SANDBOX:-false}
  INTAKE_KEY_SECRET: ${BRAND_INTAKE_KEY_SECRET:?}
  INTAKE_RATE_LIMIT_STORE: valkey
  # The owner sign-in link's public key (D-473). Empty keeps the feature off.
  OWNER_LINK_PUBLIC_KEY: ${OWNER_LINK_PUBLIC_KEY:-}
  GOTENBERG_URL: http://gotenberg:3000
  # Files (§22): the local driver on this brand's own `files` volume unless r2.
  STORAGE_DRIVER: ${BRAND_STORAGE_DRIVER:-local}
  STORAGE_LOCAL_ROOT: /data/files
  R2_ACCOUNT_ID: ${BRAND_R2_ACCOUNT_ID:-unused}
  R2_BUCKET: ${BRAND_R2_BUCKET:-unused}
  R2_ACCESS_KEY_ID: ${BRAND_R2_ACCESS_KEY_ID:-unused}
  R2_SECRET_ACCESS_KEY: ${BRAND_R2_SECRET_ACCESS_KEY:-unused}
  SENTRY_DSN: ${BRAND_SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: production

x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: '5'

x-server-image:
  &server-image # Built once per deploy by server-deploy.sh and shared by every brand; never pulled.
  image: erp-server:${ERP_RELEASE:?set by server-deploy.sh}
  pull_policy: never
  restart: unless-stopped
  logging: *logging

services:
  postgres:
    image: postgres:17.11-alpine@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
    restart: unless-stopped
    logging: *logging
    environment:
      # The container's superuser: the release step creates the three roles with it, and
      # nothing else uses it. The application connects as erp_app (§5).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${BRAND_DB_ROOT_PASSWORD:?}
      POSTGRES_DB: erp
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=en-US --encoding=UTF8'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d erp']
      interval: 5s
      timeout: 5s
      retries: 12

  valkey:
    image: valkey/valkey:8.1-alpine@sha256:d2e18f3410b6f616de1417f570fa55261af2898b9c5b2cfb6781ce2373ea43d1
    restart: unless-stopped
    logging: *logging
    command:
      - sh
      - -c
      - exec valkey-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass "$$VALKEY_PASSWORD"
    environment:
      VALKEY_PASSWORD: ${BRAND_VALKEY_PASSWORD:?}
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli -a "$$VALKEY_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 12

  gotenberg:
    image: gotenberg/gotenberg:8.37@sha256:f29984bd1e226bf1b93ba90af06000afa8b315853e99d27b9aaa41b93f15c769
    restart: unless-stopped
    logging: *logging
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-allow-list=file:///tmp/.*

  # One-shot, on every deploy: create or reset the three roles, migrate as erp_owner and
  # install the job queues (D-340). Idempotent. The brand's seed (`db:seed --brand`) runs
  # from server-deploy.sh on a database with no brand yet, never again by itself: it resets
  # the brand's name and system accounts to the template's.
  release:
    <<: *server-image
    restart: 'no'
    command:
      - sh
      - -c
      - >-
        node node_modules/@elysium/db/dist/cli/bootstrap.js &&
        node dist/main.release.js
    environment:
      <<: *server-env
      DATABASE_OWNER_URL: postgres://erp_owner:${BRAND_DB_OWNER_PASSWORD:?}@postgres:5432/erp
      DATABASE_ADMIN_URL: postgres://postgres:${BRAND_DB_ROOT_PASSWORD:?}@postgres:5432/erp
      # The read-only role's password, which the bootstrap sets. Only here: nothing in a
      # brand's API or worker reads across orgs (D-471), so neither holds this URL.
      DATABASE_ANALYTICS_URL: postgres://erp_analytics:${BRAND_DB_ANALYTICS_PASSWORD:?}@postgres:5432/erp
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    <<: *server-image
    command: ['node', '--import', './dist/instrument.js', 'dist/main.worker.js']
    environment:
      <<: *server-env
      # The worker, and only the worker, holds the owner role (§5, D-340).
      DATABASE_OWNER_URL: postgres://erp_owner:${BRAND_DB_OWNER_PASSWORD:?}@postgres:5432/erp
    volumes:
      - files:/data/files
    depends_on:
      release:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

  # M38c (D-672 to D-676): records the packing tables' IP cameras (Orders → Pack → Settings →
  # IP cameras) into a rolling buffer and cuts each packing's video from it. The same image;
  # the application role only (no owner URL); nothing published. It reaches the cameras on the
  # shop's LAN through Docker's default bridge, as the worker can; the camera's password is
  # entered in the ERP's settings (sealed with the brand's credentials key), never here.
  camera:
    <<: *server-image
    command: ['node', '--import', './dist/instrument.js', 'dist/main.camera.js']
    environment:
      <<: *server-env
      CAMERA_BUFFER_DIR: /data/camera
    volumes:
      # The cut is kept as a private packing video in the same files volume the API serves.
      - files:/data/files
      # At most half an hour of each camera's stream.
      - camera-buffer:/data/camera
    depends_on:
      release:
        condition: service_completed_successfully
      # The worker installs the job queues the camera process works.
      worker:
        condition: service_started

  api:
    <<: *server-image
    environment: *server-env
    ports:
      # Loopback only: the host's nginx is the way in. Each brand has its own port.
      - '127.0.0.1:${BRAND_API_PORT:?}:3000'
    volumes:
      - files:/data/files
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      release:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      gotenberg:
        condition: service_started

volumes:
  postgres-data:
  files:
  camera-buffer:
