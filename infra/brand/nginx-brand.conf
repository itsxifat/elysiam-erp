# nginx site for one brand's ERP (M31, D-474, D-475): its admin host on one origin.
#
#   /             the staff console   files in /var/www/erp-__SLUG__/current/www
#   /portal/      the portal          .../www/portal
#   /pos/         the till            .../www/pos
#   /v1/ /api/auth/ /api/admin/scanner/ /public/v1/ /storefront/ /ncom/ /media/ /health/
#   /socket.io/
#                 the brand's API, published by Docker on 127.0.0.1:__API_PORT__
#
# A template: server-deploy.sh fills __ADMIN_HOST__, __SLUG__, __ID__ (the slug with
# underscores, for nginx's names) and __API_PORT__ from the brand's .env.brand and installs
# it once as /etc/nginx/sites-available/erp-__SLUG__.conf; certbot then adds the 443 server
# and the redirect, so the file is never overwritten. One site per brand, one certificate per
# admin host. docs/runbooks/brand-deploy.md has the rest.
#
# `current` is a symlink server-deploy.sh moves to each release; the header files it
# includes come with the release (the CSP carries each build's script hash).

upstream erp___ID___api {
    server 127.0.0.1:__API_PORT__;
    keepalive 16;
}

# Named for this site: map names are global across every site on the host.
map $http_upgrade $erp___ID___connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name __ADMIN_HOST__;

    # Behind Cloudflare: the visitor's address from CF-Connecting-IP, trusted only from
    # Cloudflare's ranges (nginx-cloudflare-realip.conf). server-deploy.sh replaces this line.
    #__REAL_IP_INCLUDE__

    root /var/www/erp-__SLUG__/current/www;
    index index.html;
    absolute_redirect off;

    # CSV imports are the largest bodies the API takes.
    client_max_body_size 25m;

    # The SPAs' files only: proxied API answers stay uncompressed (gzip_proxied is off by
    # default), so no response carrying a secret is compressed next to attacker input.
    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # --- the API --------------------------------------------------------------------------
    # X-Forwarded-For is set to the visitor's address, never appended to: the API trusts
    # exactly one proxy hop (TRUSTED_PROXY_COUNT=1).
    # `/public/v1` is the order intake (signed, no cookies); `/storefront` and `/media` are
    # the brand website's server-to-server reads and its product images (M33); `/ncom` is
    # ncom.bd's connector, order handover and webhook (M35b, HMAC-signed, no cookies).
    # `/api/admin/scanner` is the packing scanner app as it ships (M35b, D-554).
    location ~ ^/(v1|api/auth|api/admin/scanner|public/v1|storefront|ncom|media|health)(/|$) {
        proxy_pass http://erp___ID___api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Socket.IO (the realtime gateway, §19): a long-lived WebSocket.
    location /socket.io/ {
        proxy_pass http://erp___ID___api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $erp___ID___connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # --- the SPAs -------------------------------------------------------------------------
    # Content-hashed files: cached for a year, never revalidated.
    location ~ ^/(portal/|pos/)?assets/ {
        # Not `always`: a 404 must not be cached for a year.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /portal {
        return 301 /portal/;
    }
    location /portal/ {
        include /var/www/erp-__SLUG__/current/nginx/portal.conf;
        try_files $uri /portal/index.html;
    }

    location = /pos {
        return 301 /pos/;
    }
    # The till's install manifest. nginx's mime.types has no entry for the extension.
    location = /pos/manifest.webmanifest {
        include /var/www/erp-__SLUG__/current/nginx/pos.conf;
        types { }
        default_type application/manifest+json;
    }
    location /pos/ {
        include /var/www/erp-__SLUG__/current/nginx/pos.conf;
        try_files $uri /pos/index.html;
    }

    # Every other path is the console's (its router owns them, `/owner-link` included).
    location / {
        include /var/www/erp-__SLUG__/current/nginx/console.conf;
        try_files $uri /index.html;
    }
}
