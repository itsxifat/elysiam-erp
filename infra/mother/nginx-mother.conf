# nginx site for the owner console (M32, D-491): one origin, the owner's own domain.
#
#   /                the console's files     /var/www/mother/current/www
#   /v1/ /api/auth/  the mother API          published by Docker on 127.0.0.1:MOTHER_API_PORT
#
# Installed by server-deploy.sh on the first deploy, with __OWNER_DOMAIN__ and __API_PORT__
# replaced; certbot then adds the 443 server and the redirect, so the file is never
# overwritten afterwards:
#   sudo certbot --nginx -d <domain>
#
# Nothing else is served on this host name, and no page here sends a Referer anywhere: the
# owner's "Open <brand> ERP" must not tell a brand where the owner came from (D-490).

upstream mother_api {
    server 127.0.0.1:__API_PORT__;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name __OWNER_DOMAIN__;

    root /var/www/mother/current/www;
    index index.html;
    absolute_redirect off;
    client_max_body_size 1m;
    server_tokens off;

    # Every answer, the API's included.
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # --- the API ------------------------------------------------------------------------
    # X-Forwarded-For is set, never appended: the API believes this proxy's address only.
    location ~ ^/(v1|api/auth)(/|$) {
        proxy_pass http://mother_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- the console --------------------------------------------------------------------
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        # The console's scripts are its own files; it calls only this origin.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
