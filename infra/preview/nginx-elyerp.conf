# nginx site for the single-server preview (D-352): elyerp.enfinito.cloud on one origin.
#
#   /             the console        files in /var/www/elyerp/current/www
#   /portal/      the portal         .../www/portal
#   /pos/         the till           .../www/pos
#   /v1/ /api/auth/ /public/v1/ /socket.io/ /health/
#                 the API, published by Docker on 127.0.0.1:3410 (paths as the apps call them)
#
# Install once (docs/runbooks/preview-server.md):
#   sudo cp infra/preview/nginx-elyerp.conf /etc/nginx/sites-available/elyerp.conf
#   sudo ln -s /etc/nginx/sites-available/elyerp.conf /etc/nginx/sites-enabled/elyerp.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d elyerp.enfinito.cloud      # adds the 443 server and the redirect
#
# `current` is a symlink infra/preview/deploy.sh moves to each release; the header files it
# includes come with the release (the CSP carries each build's script hash), so every deploy
# ends with `nginx -t` and a reload.

upstream elyerp_api {
    server 127.0.0.1:3410;
    keepalive 16;
}

# Named for this site: map names are global across every site on the host.
map $http_upgrade $elyerp_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name elyerp.enfinito.cloud;

    root /var/www/elyerp/current/www;
    index index.html;
    # Redirects say `/portal/`, not a full URL nginx would build from the port it listens on.
    absolute_redirect off;

    # CSV imports are the largest bodies the API takes; uploads to the local file store
    # are limited by the API itself.
    client_max_body_size 25m;

    # The SPAs' files only: proxied API answers stay uncompressed (gzip_proxied is off by
    # default), so no response carrying a secret is compressed next to attacker input.
    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # --- the API --------------------------------------------------------------------------
    # X-Forwarded-For is set to the visitor's address, never appended to: the API trusts
    # exactly one proxy hop (TRUSTED_PROXY_COUNT=1), and a header the visitor wrote must not
    # reach it.
    # `/public/v1` is the brand websites' order intake (signed, no cookies).
    location ~ ^/(v1|api/auth|public/v1|health)(/|$) {
        proxy_pass http://elyerp_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Socket.IO (the realtime gateway, §19): a long-lived WebSocket.
    location /socket.io/ {
        proxy_pass http://elyerp_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $elyerp_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # --- the SPAs -------------------------------------------------------------------------
    # Content-hashed files: cached for a year, never revalidated.
    location ~ ^/(portal/|pos/)?assets/ {
        # Not `always`: a 404 must not be cached for a year.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /portal {
        return 301 /portal/;
    }
    location /portal/ {
        include /var/www/elyerp/current/nginx/portal.conf;
        try_files $uri /portal/index.html;
    }

    location = /pos {
        return 301 /pos/;
    }
    # The till's install manifest. nginx's mime.types has no entry for the extension.
    location = /pos/manifest.webmanifest {
        include /var/www/elyerp/current/nginx/pos.conf;
        types { }
        default_type application/manifest+json;
    }
    location /pos/ {
        include /var/www/elyerp/current/nginx/pos.conf;
        try_files $uri /pos/index.html;
    }

    # Every other path is the console's (its router owns them).
    location / {
        include /var/www/elyerp/current/nginx/console.conf;
        try_files $uri /index.html;
    }
}
